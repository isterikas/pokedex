name: Validate Pokédex

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/pokemon-data
          key: pokemon-data-v1-${{ hashFiles('scripts/**', 'src/types/pokemon.ts') }}
      - name: Generate the local dataset and consistent sprite set
        run: npm run generate
      - name: Validate generated data and sprite integrity
        run: npm run validate
      - name: Type check, lint, and test
        run: npm run check
      - name: Verify the web bundle
        run: npm run export:web
